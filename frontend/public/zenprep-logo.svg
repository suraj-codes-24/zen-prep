<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="88" stroke="url(#grad1)" stroke-width="3" fill="none" opacity="0.3"/>
  <!-- Inner glow circle -->
  <circle cx="100" cy="100" r="72" fill="url(#grad2)" opacity="0.08"/>
  <!-- Z mark -->
  <path d="M68 68 L132 68 L68 132 L132 132" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Accent dot -->
  <circle cx="132" cy="68" r="6" fill="#818CF8"/>
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#818CF8"/>
    </linearGradient>
    <radialGradient id="grad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
</svg>
